# Global system settings. Placeholders are marked REPLACE_ME and block live mode.

mode: dry_run # dry_run | live. Preflight (scripts/preflight.py) must pass before live.

timezone: America/New_York

booking:
  tool: cal.com
  # Two separate scheduler URLs - both book directly onto Ethan's calendar. Picked by
  # the lead's icp at draft time (booking-reply skill) and in the standard sequence's
  # own CTA once wired into Apollo sequence copy.
  #
  # UTM-tagged so a Cal.com booking's tracking metadata shows it came from cold outreach,
  # not the website - lets the "Log a booked call" webhook (dashboard/app/api/webhooks/cal)
  # and any future funnel-source reporting tell the two apart. The website's own Tier CTAs
  # use the bare links (or their own utm_source=website tag) - that's set in Webflow, not here.
  links:
    startups: https://cal.com/hellopolymer/intro?utm_source=cold-email&utm_medium=email&utm_campaign=startups
    churches: https://cal.com/hellopolymer/church-website-intro-call?utm_source=cold-email&utm_medium=email&utm_campaign=churches

approval:
  # Booking emails to interested replies are drafted, then held in
  # data/queue/pending-approval/ until a human merges the approval PR.
  # Flip to auto only after classification accuracy is proven on real replies.
  interested_reply_email: required # required | auto

limits:
  max_decision_makers_per_org: 2
  new_leads_scored_per_day: 50
  emails_drafted_per_day: 25
  # Per-mailbox send caps are NOT here on purpose - they live under inbox_health.send_caps
  # so they stay health-aware (warmup vs healthy). One source of truth.

scoring:
  hot_min: 75
  warm_min: 50
  # Cold (<50) leads are tagged and skipped for now; revisit after calibration.
  draft_cold_tier: false

sequence:
  steps: 3
  # Days after the previous step. Step 1 sends immediately on sequence entry.
  wait_days: [3, 4]
  # No-reply after step 3: tag for recycle, re-enter with a fresh angle after this many days.
  recycle_after_days: 90

can_spam:
  physical_address: "239 Betsey Scull Rd, Egg Harbor Twp, NJ 08234"
  unsubscribe: apollo_opt_out_link

notifications:
  channel: email
  to: ethan@hellopolymer.com
  from: alerts@hellopolymer.com
  # Delivery uses RESEND_API_KEY if set, else SMTP_* vars, else logs to
  # data/notifications/. See scripts/notify.py.

inbox_health:
  provider: apollo # scripts/apollo_inbox_health.py, checked daily. TrulyInbox retired
    # 2026-10-14 - Apollo handles warming itself, and this computes bounce rate from
    # Apollo's own send data instead. Narrower than TrulyInbox (no blacklist/SPF/DKIM
    # checks - Apollo's API has no equivalent), but needs no separate paid service.
  thresholds:
    # Bounce rate %, not a 0-100 score. Starting lines per common cold-email guidance;
    # tune once there's real send volume to learn from (mode is still dry_run).
    bounce_watch_above_pct: 3 # trending risky: ease this mailbox's volume, include in digest
    bounce_alarm_above_pct: 5 # act now: pause sends, connect + warm a replacement inbox
    min_sends_to_evaluate: 20 # fewer sends than this and a bounce % is just noise
  send_caps:
    warmup_daily: 10 # per mailbox while still warming
    healthy_daily: 22 # per mailbox once healthy (reference doc says 20-25)
