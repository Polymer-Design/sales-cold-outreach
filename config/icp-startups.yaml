# Startup ICP definition.
# Locked 2026-07-13 per docs/icp-startups-source.md (Ethan's finalized doc). status: final
# unblocks live mode's ICP-status preflight check. Scoring POINT ALLOCATIONS are still open
# on purpose - needs real closed-won data - see .claude/skills/lead-scoring/SKILL.md.
status: final

description: >
  Growth-stage SaaS and tech-enabled startups in the US. Series A-C is the typical band,
  not a hard wall - well-funded seed and profitable bootstrapped teams both fit; Series D+
  can still fit via an embedded-team framing.

excluded:
  # Considered and cut deliberately - not a capability fit for what Polymer builds.
  - e-commerce / DTC companies

services_this_icp_maps_to:
  - Webflow website builds (new_build_track)
  - Ongoing monthly plan design (subscription_track - Care/Grow/Partner/Partner Plus,
    see knowledge/business-overview.md)
  # Pitch decks and brand/identity design are real Polymer services but are NOT currently
  # factored into this ICP's scoring - the two tracks above are what the technographic
  # signal is built around.

# Detected via scripts/platform_detect.py. Same mechanic as the church ICP.
website_platform_routing:
  webflow: subscription_track # monthly plan pitch (Grow/Partner), NOT a rebuild pitch -
    # tiers/prices live in knowledge/business-overview.md, not duplicated here
  squarespace: new_build_track
  wix: new_build_track
  wordpress: new_build_track
  other: new_build_track
  unknown: new_build_track

pagespeed_signal:
  enabled: true
  applies_to: both tracks
  # Same constraint as the church ICP: citable as a raw fact about the lead's site, NOT
  # as a comparative claim until knowledge/pagespeed-benchmark.md moves past PENDING.

vertical_signal:
  status: not_proven # confirmed 2026-07-13. Do NOT manufacture a vertical-fit signal to
    # fake a differentiator that doesn't exist - that was the exact problem with the old
    # placeholder ("relevant tech stack signals tied to what Polymer sells"), which had
    # nothing real behind it. Revisit if a real cluster of shipped work emerges (e.g. if
    # Fispoke/fintech becomes a repeated pattern) - then a vertical weight becomes worth adding.

# Time-sensitive, decays like other trigger signals (see lead-scoring skill). This hire is
# rarely also a web developer, so the site build tends to get outsourced around the same
# time the hire happens. Bonus: this title is frequently ALSO the decision-maker contact.
trigger_signal_titles:
  - Head of Growth
  - Head of Marketing
  - VP Marketing
  - Growth Marketer
  - Marketing Manager
  - Demand Gen Manager

# Static firmographic signal, re-check periodically - NOT a decaying trigger.
firmographic_in_house_capability_signal:
  absence_of_in_house_design_dev: positive # positive fit signal for the BUILD service
  active_job_posting_designer_or_frontend_dev: negative # they're building the capability
    # internally - negative for the build service specifically. Doesn't necessarily
    # affect subscription-track fit.

# Priority order for the max-2-decision-makers rule. Conditional on company stage:
# if a marketing hire exists, they're the day-to-day driver (contact them first); the
# Founder/CEO stays as the second contact for budget sign-off. If no marketing hire
# exists yet, the Founder/CEO IS the primary contact directly.
decision_maker_titles:
  # Post-first-marketing-hire stage (the DOMINANT case in Polymer's target band): owns
  # research, vendor selection, day-to-day project management. Top priority when present.
  - Head of Marketing
  - Head of Growth
  # Pre-marketing-hire stage: owns positioning, content, and the site directly. Also
  # retains final budget sign-off even after a marketing hire exists at this company size.
  - Founder
  - CEO
  # Secondary - sometimes co-owns vendor contracts/logistics, not the strategic driver.
  - COO
  - Head of Ops
  # "CMO" is explicitly NOT worth targeting at this ICP's size - a formal CMO-level budget
  # hierarchy doesn't appear until a marketing team scales to 8-12 people, past this band.

apollo_filters:
  person_titles: ["head of marketing", "head of growth", "founder", "ceo", "coo", "head of ops"]
  person_seniorities: [founder, c_suite, vp, head]
  person_locations: ["United States"]
  organization_num_employees_ranges: ["5,50"]
  contact_email_status: [verified]
  # Tightened 2026-10-14 off the first real ingestion run (25 leads, all scored cold):
  # the filter had no vertical signal by design, so title/seniority/employee-count alone
  # surfaced a lot of non-fit noise - DTC/food-CPG brands, a 20yr-old steady-state
  # business, consulting/web-design shops (direct competitors), a stale/acquired org.
  # Not meant to replace scoring's manual screening (Apollo has no single clean filter for
  # "growth-stage tech startup"), just to stop spending enrichment credits on the most
  # obviously-wrong categories before they ever reach scoring.
  organization_founded_year_range: {min: 2012} # cuts decades-old "steady-state" businesses
    # that happen to fit the employee-count band but aren't growth-stage by any definition
  organization_include_unknown_founded_year: true # don't lose a real lead just because
    # Apollo hasn't recorded its founding year - only exclude a CONFIRMED old company
  not_organization_naics_codes:
    - "454"  # electronic shopping and mail-order houses (DTC/ecommerce)
    - "5415" # computer systems design and related services - i.e. web/software dev
      # shops, who ARE the build capability Polymer sells, not a buyer of it (caught a
      # real one, Lightmark Media, in the first run)
    - "5416" # management, scientific, and technical consulting
    - "523"  # securities, commodity contracts, and other financial investments (VC/PE)
  # Tightened again 2026-10-16 off the first real scoring run: 0 of 25 scored leads
  # cleared warm (best score 45/50). Checked the actual score_notes for all 25 before
  # changing anything - this ICP does NOT require literal SaaS/software (only
  # e-commerce/DTC is a real hard exclusion per lead-scoring/SKILL.md Step 0, and Step 3
  # explicitly says NOT to score vertical - "No proven vertical-fit signal exists...
  # score 0/neutral, not a guess"). The actual pattern in the noise (real estate
  # investment, property management, auto dealership, restaurant, glass fabrication,
  # freight/logistics, jewelry manufacturing, a 1948 machinery business) isn't "wrong
  # vertical" - it's "not growth-stage at all": local/legacy small businesses that
  # happen to match on title+seniority+employee-count, which is too loose a proxy for
  # "Series A-C or well-funded seed/bootstrapped," the ICP's actual firmographic
  # definition (icp-startups.yaml description, lead-scoring Step 2). A software-keyword
  # requirement would fix this noise but wrongly cut real adjacent-vertical tech-enabled
  # startups (health-tech, fintech, proptech, edtech, etc.) that don't happen to use
  # those exact words - exactly the over-narrowing risk flagged when this file was first
  # tightened. Filtering for actual growth trajectory instead directly matches the ICP's
  # own definition without that risk - a 50-year-old glass fabrication shop or a local
  # auto dealership essentially never shows double-digit headcount growth, while a real
  # scaling startup almost always does, in any vertical.
  organization_headcount_growth_range: {min: 5} # modest floor on purpose - Apollo's
    # growth data can be sparse for small private companies, and there's no "include
    # unknown" companion flag for this filter (unlike founded_year_range above), so too
    # high a floor risks silently losing real leads that just lack tracked growth data,
    # not lacking growth. Watch the next real run's results before tightening further.
  organization_headcount_growth_past_n_months: 12

# A SECOND, additional sourcing channel - not a replacement for apollo_filters above, run
# alongside it (see pipeline/daily-run.md). Added 2026-10-16 per Ethan's explicit request.
# Apollo's own org data tags Y Combinator batch companies directly (confirmed live: many
# literally carry "(YC W24)"/"(YC S23)"/etc in their Apollo company name), which makes this
# a real, repeatable, free-to-search channel - not a one-off scrape. YC already does the
# growth-stage/legitimacy vetting, so this channel needs less defensive filtering than the
# broad channel above; same decision-maker titles/seniorities since it's still this ICP,
# just a different source query. organization_founded_year_range enforces "the past few
# years" as Ethan asked, rather than relying on incidental batch-recency distribution.
# Known noise this doesn't fully filter out: YC-adjacent VC funds and accelerator programs
# that get swept in by the same keyword match (e.g. "Rebel Fund," "Orange Collective," a
# university accelerator) - the NAICS/SIC exclusions below catch the investment-fund ones;
# accelerator programs don't have a clean industry code to exclude on, so expect
# lead-scoring's existing judgment to catch those the same way it already caught an
# unrelated VC firm in the broad channel ("wrong business model for this ICP").
apollo_filters_yc:
  person_titles: ["head of marketing", "head of growth", "founder", "ceo", "coo", "head of ops"]
  person_seniorities: [founder, c_suite, vp, head]
  person_locations: ["United States"]
  organization_num_employees_ranges: ["5,50"]
  contact_email_status: [verified]
  q_organization_keyword_tags: ["Y Combinator", "YC"]
  organization_founded_year_range: {min: 2019}
  organization_include_unknown_founded_year: true
  not_organization_naics_codes:
    - "5231"   # investment offices (VC funds caught by the same YC keyword match)
    - "523940" # portfolio management / investment advice
  not_organization_sic_codes:
    - "6726" # investment offices, NEC
    - "6732" # investment offices (the SIC-coded equivalent some funds carry instead)

trigger_signals:
  - recent funding round (0-90 days strongest)
  - new marketing/growth hire (see trigger_signal_titles above)
  - product launch or rebrand announcement
  - press coverage or conference presence

negative_overrides:
  - e-commerce / DTC company - score 0, wrong ICP regardless of other fit
  - prior "not interested" or opted out - do-not-contact, never re-add
