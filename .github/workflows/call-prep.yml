name: Call prep briefing

# Fired by Cal.com's native webhook (dashboard/app/api/webhooks/cal) or the dashboard's
# manual "Log a booked call" button, both via repository_dispatch, the moment someone
# books a call. See dashboard/README.md for the Cal.com webhook setup.
on:
  repository_dispatch:
    types: [call_booked]
  workflow_dispatch:
    inputs:
      name: {description: "Test: contact name", default: "Test Person"}
      email: {description: "Test: contact email", default: "test@example.com"}
      icp: {description: "Test: startups or churches", default: "startups"}
      appointment_time: {description: "Test: appointment time", default: "2026-08-01T15:00:00-04:00"}
      org_name: {description: "Test: org name", default: ""}

permissions:
  id-token: write # required by anthropics/claude-code-action to auth via OIDC
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt google-api-python-client google-auth

      - name: Build the call-prep briefing with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read CLAUDE.md, then run the call-prep skill for this booked call:

            name: ${{ github.event.client_payload.name || github.event.inputs.name }}
            email: ${{ github.event.client_payload.email || github.event.inputs.email }}
            icp: ${{ github.event.client_payload.icp || github.event.inputs.icp }}
            appointment_time: ${{ github.event.client_payload.appointment_time || github.event.inputs.appointment_time }}
            org_name: ${{ github.event.client_payload.org_name || github.event.inputs.org_name }}

            Follow the skill exactly, all 7 steps: match against data/, research the
            company/industry, refresh the tech-stack + sitemap scope, recommend a package,
            write the briefing, email it via scripts/notify.py + commit it, and mirror it
            (plus the matched sequence file, if any) into the org's Drive folder via
            scripts/drive_intro_folder.py.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
        env:
          GOOGLEPAGESPEEDINSIGHTS_API_KEY: ${{ secrets.GOOGLEPAGESPEEDINSIGHTS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          INTRO_SALES_DRIVE_FOLDER_ID: ${{ secrets.INTRO_SALES_DRIVE_FOLDER_ID }}

      - name: Push the briefing file
        # anthropics/claude-code-action rewrites the git remote to use its own
        # short-lived installation token, then revokes that token as soon as its step
        # ends - before this step runs. A plain `git push` here silently fails auth
        # (previously masked by `|| true`). Push against an explicit, fresh URL using
        # this job's own github.token so it doesn't depend on what that action left behind.
        #
        # Confirmed live 2026-10-14: a real run's briefing was lost this exact way (push
        # rejected because another workflow pushed to main first, no fetch/rebase to
        # recover) - same bug already fixed in daily-pipeline.yml/church-crawler.yml,
        # just missed here. Fetch+rebase+retry before giving up.
        run: |
          git config user.name "outreach-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add data/call-prep/
          git diff --cached --quiet || git commit -m "call prep briefing $(date -u +%FT%H:%M)"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching + rebasing onto latest ${{ github.ref_name }}..."
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              git rebase --abort
              echo "::warning::Rebase conflict - the call-prep briefing could NOT be pushed. Manual resolution needed."
              exit 0
            fi
          done
          echo "::warning::Still rejected after 5 fetch+rebase attempts - check this step's log"
