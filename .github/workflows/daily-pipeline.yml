name: Daily outreach pipeline

# Primary trigger: Vercel cron (dashboard/vercel.json) -> workflow_dispatch, ~9:07am ET.
# GitHub's own `schedule:` is only a backup now - measured 2026-10-12..26 it fired 4.5-6.5h
# late every weekday and skipped two Fridays entirely (top-of-hour crons are GitHub's most
# congested slot; their docs say queued schedule runs can be dropped under load). The backup
# runs off-peak and later; the guard job makes whichever trigger arrives second a no-op.
on:
  schedule:
    - cron: "41 14 * * 1-5" # backup only, ~10:41am ET weekdays
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if a pipeline run already happened today"
        type: boolean
        default: false

permissions:
  id-token: write # required by anthropics/claude-code-action to auth via OIDC
  contents: write
  issues: write
  pull-requests: write

jobs:
  guard:
    # One real pipeline run per ET day. Any earlier run of this workflow today (queued,
    # running, or finished - anything but cancelled) means this one exits here, in seconds,
    # before Claude is ever called. Counting failed runs too is deliberate: a retry would
    # spend another ~$7-9, and partial work from a crash is already committed.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d "$(TZ=America/New_York date +%F) 00:00 $(TZ=America/New_York date +%z)" +%FT%TZ)
          earlier=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-pipeline.yml/runs?created=%3E%3D${since}&per_page=100" \
            --jq '[.workflow_runs[] | select(.run_number < ${{ github.run_number }}) | select(.conclusion != "cancelled")] | length')
          if [ "$earlier" -gt 0 ]; then
            echo "Already ran today ($earlier earlier run(s) since $since) - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  daily:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    # Job-level (not workflow-level) so a guarded duplicate never enters the queue - GitHub
    # cancels the PENDING run in a concurrency group whenever another one joins, so a
    # duplicate sitting in the group could knock out a real pending reply-check.
    concurrency:
      group: outreach-pipeline
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90 # raised from 60 2026-10-16 - scoring needs real headroom now that
      # step 1 scores backlog before ingesting. Briefly 120 on 2026-10-17 for a 30-lead
      # batch experiment that got rolled back same day (see pipeline/daily-run.md) -
      # reverted alongside it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Check weekly cost cap
        # Soft guardrail (config/system.yaml cost_caps.weekly_usd, set by Ethan 2026-10-17):
        # if the trailing 7 days of real recorded spend is already at/over the cap, skip
        # today's run entirely rather than let costs compound unchecked. This can't stop a
        # run already in progress from overspending (see scripts/cost_tracker.py's own
        # docstring) - it only gates the NEXT run from starting.
        id: cost_check
        run: |
          if python3 scripts/cost_tracker.py check --window week; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            python3 scripts/notify.py \
              --subject "Daily pipeline skipped - weekly cost cap reached" \
              --body "Today's daily-pipeline run was skipped because the trailing 7-day Claude spend is at or over the configured cap (config/system.yaml cost_caps.weekly_usd). No new leads were scored or ingested, and no new emails went out today. Raise the cap in config/system.yaml if this is expected, or wait for the week to roll off." \
              --urgency alarm
          fi
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Run daily pipeline with Claude
        if: steps.cost_check.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read CLAUDE.md, then execute pipeline/daily-run.md end to end.
            Commit data/ changes as instructed. Use `gh` (GH_TOKEN is set) for any
            issues or PRs the instructions call for.
          # max-turns raised 150->200 2026-10-17 - a run that genuinely finished the full
          # 15-lead cycle (real success, 9 warm leads pushed live) still got marked
          # "failure" by the action's own wrapper for landing at 173 turns; nothing was
          # lost (if:always() below saved it anyway) but a real success showing red is
          # confusing. Briefly 260 same day for a 30-lead batch experiment that got rolled
          # back (see pipeline/daily-run.md) - reverted alongside it. Raised 200->260 on
          # 2026-10-28: a complete, successful run (20 contacts pushed, ~26 drafts) took 217
          # turns and was marked "failure" even though everything was committed. Spend is
          # bounded by the weekly cost cap, not this number.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 260
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          GOOGLEPAGESPEEDINSIGHTS_API_KEY: ${{ secrets.GOOGLEPAGESPEEDINSIGHTS_API_KEY }}
          GH_TOKEN: ${{ github.token }}

      - name: Record run cost
        # Feeds the weekly cap check above. Reads the SDK's own execution log (written by
        # the action regardless of the run's own outcome) rather than anything self-reported
        # by Claude - the agent can't read its own final cost from inside its own run, since
        # that value isn't known until the SDK finalizes, after the agent's last turn. Safe
        # to run even when the prior step was skipped (cap already hit) or crashed - the
        # script just finds nothing to record and exits quietly.
        if: always()
        run: |
          python3 scripts/cost_tracker.py record --workflow daily-pipeline \
            --log /home/runner/work/_temp/claude-execution-output.json || true

      - name: Push any uncommitted data changes
        # anthropics/claude-code-action rewrites the git remote to its own short-lived
        # token, then revokes it right after its step ends - before this step runs.
        # A plain `git push` here fails auth silently if it relies on that credential.
        # Push against an explicit, fresh URL using this job's own github.token instead.
        #
        # This job can run for up to an hour - long enough for another workflow or a
        # human to push to main in the meantime, which rejects a plain push outright
        # (confirmed live 2026-10-14: a real run's lead data was lost this way - 41 turns
        # and real API spend, discarded because the push step never re-checked origin).
        # Fetch + rebase + retry before giving up, same as the git discipline used
        # everywhere else in this repo.
        #
        # if: always() added 2026-10-17 - a run that hits error_max_turns (scoring a big
        # backlog can genuinely take more turns than expected) was ending this step
        # "skipped" by GitHub's default (only runs after a successful prior step), which
        # threw away every real score/edit the agent made before running out of turns -
        # confirmed live: a run spent 151 turns / $9.33 of real research, crashed on the
        # turn cap, and committed nothing. Whatever got written to data/ before a crash is
        # still real work and should never be discarded.
        if: always()
        run: |
          git config user.name "outreach-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add data/
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F) (workflow sweep)"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching + rebasing onto latest ${{ github.ref_name }}..."
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              git rebase --abort
              echo "::error::Rebase conflict against origin/${{ github.ref_name }} - this run's data/ changes could NOT be pushed. Manual resolution needed."
              exit 1
            fi
          done
          echo "::error::Still rejected after 5 fetch+rebase attempts - giving up."
          exit 1
