name: PageSpeed benchmark

# One-click: measure Polymer's own client sites and write/refresh the citable benchmark
# (knowledge/pagespeed-benchmark.md), flipping it to status: approved. Run it again any time
# to refresh the numbers. Edit the site list in scripts/build_pagespeed_benchmark.py.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Measure client sites and write the benchmark
        run: python scripts/build_pagespeed_benchmark.py
        env:
          GOOGLEPAGESPEEDINSIGHTS_API_KEY: ${{ secrets.GOOGLEPAGESPEEDINSIGHTS_API_KEY }}

      - name: Commit the refreshed benchmark
        run: |
          git config user.name "outreach-bot"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge/pagespeed-benchmark.md
          git diff --cached --quiet || git commit -m "refresh PageSpeed benchmark $(date -u +%F)"
          git push
