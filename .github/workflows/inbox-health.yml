name: Inbox health check

on:
  schedule:
    - cron: "0 12 * * *" # daily 8am ET, before the pipeline runs
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check mailbox health via Apollo
        run: python scripts/apollo_inbox_health.py
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Commit health snapshot and any notification log
        # fetch+rebase+retry before giving up on a rejected push, same as every other
        # workflow in this repo (a bare `push || true` silently drops this run's
        # snapshot if another workflow pushed to main in the meantime).
        run: |
          git config user.name "outreach-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/inbox-health/ data/notifications/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "inbox health check $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching + rebasing onto latest ${{ github.ref_name }}..."
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              git rebase --abort
              echo "::warning::Rebase conflict - this run's snapshot could NOT be pushed."
              exit 0
            fi
          done
          echo "::warning::Still rejected after 5 fetch+rebase attempts - giving up."
