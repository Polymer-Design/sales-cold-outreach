name: Church crawler

# Weekdays ~7:23am ET via Vercel cron (dashboard/vercel.json -> workflow_dispatch), ahead of
# the 9:07 daily pipeline that turns new candidates into contacts. No GitHub `schedule:` -
# see daily-pipeline.yml for why GitHub's cron isn't relied on. Each run first refills the
# seed list from Apollo when fewer than 150 seeds are waiting (1 credit per page of up to
# 100 orgs), then checks up to 100 new seeds for a Planning Center signal.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max seeds to check (crawl mode only)"
        default: "100"
      mode:
        description: "crawl (seeds.csv) or probe (probe-slugs.csv) - see script docstring"
        default: "crawl"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refill seeds from Apollo when running low
        if: ${{ (github.event.inputs.mode || 'crawl') == 'crawl' }}
        run: python scripts/church_crawler.py replenish --want 150 --max-pages 5
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      - name: Crawl or probe for Planning Center signal
        run: |
          mode="${{ github.event.inputs.mode || 'crawl' }}"
          if [ "$mode" = "probe" ]; then
            python scripts/church_crawler.py probe
          else
            python scripts/church_crawler.py crawl --limit "${{ github.event.inputs.limit || '100' }}"
          fi
      - name: Commit new candidates
        # Same fetch+rebase+retry discipline as daily-pipeline.yml - a bare `git push`
        # here lost a real run's results once already when another workflow pushed to
        # main in the meantime (see that workflow's history for the postmortem).
        run: |
          git config user.name "outreach-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/leads/churches/
          git diff --cached --quiet || git commit -m "church crawler: new candidates $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching + rebasing onto latest ${{ github.ref_name }}..."
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              git rebase --abort
              echo "::error::Rebase conflict - this run's candidates could NOT be pushed."
              exit 1
            fi
          done
          echo "::error::Still rejected after 5 fetch+rebase attempts - giving up."
          exit 1
