name: Reply check

# Primary trigger: Vercel cron (dashboard/vercel.json) -> workflow_dispatch at ~9:17am,
# 1:17pm, 5:17pm ET weekdays. GitHub's `schedule:` is a late, off-peak backup only - see
# daily-pipeline.yml for why. The guard job makes a duplicate trigger for the same slot a
# no-op.
on:
  schedule:
    - cron: "47 14,18,22 * * 1-5" # backup only
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if a reply check ran in the last 150 minutes"
        type: boolean
        default: false

permissions:
  id-token: write # required by anthropics/claude-code-action to auth via OIDC
  contents: write
  issues: write
  pull-requests: write

jobs:
  guard:
    # Slots are 4h apart; skip if any earlier non-cancelled reply-check started in the last
    # 150 minutes (i.e. this slot was already covered by the other trigger).
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '150 minutes ago' +%FT%TZ)
          earlier=$(gh api "repos/${{ github.repository }}/actions/workflows/reply-check.yml/runs?created=%3E%3D${since}&per_page=100" \
            --jq '[.workflow_runs[] | select(.run_number < ${{ github.run_number }}) | select(.conclusion != "cancelled")] | length')
          if [ "$earlier" -gt 0 ]; then
            echo "Slot already covered ($earlier earlier run(s) since $since) - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  replies:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    concurrency:
      group: outreach-pipeline
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Check and classify replies with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read CLAUDE.md, then execute pipeline/reply-check.md end to end.
            Commit data/ changes as instructed. Use `gh` (GH_TOKEN is set) for the
            approval PRs and flag issues the instructions call for.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch"
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GH_TOKEN: ${{ github.token }}

      - name: Push any uncommitted data changes
        # anthropics/claude-code-action rewrites the git remote to its own short-lived
        # token, then revokes it right after its step ends - before this step runs.
        # A plain `git push` here fails auth silently if it relies on that credential.
        # Push against an explicit, fresh URL using this job's own github.token instead.
        #
        # This runs every 2 hours on weekdays - the highest-frequency Claude-driven job
        # in the repo, so the highest odds of colliding with another workflow's push.
        # Same fetch+rebase+retry fix already proven live on daily-pipeline.yml.
        run: |
          git config user.name "outreach-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add data/
          git diff --cached --quiet || git commit -m "reply check $(date -u +%FT%H:%M) (workflow sweep)"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching + rebasing onto latest ${{ github.ref_name }}..."
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              git rebase --abort
              echo "::error::Rebase conflict - this run's changes could NOT be pushed."
              exit 1
            fi
          done
          echo "::error::Still rejected after 5 fetch+rebase attempts - giving up."
          exit 1
