name: Biweekly self-review

on:
  schedule:
    - cron: "0 14 1,15 * *" # 1st and 15th, 10am ET
  workflow_dispatch: {}

permissions:
  id-token: write # required by anthropics/claude-code-action to auth via OIDC
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: outreach-pipeline
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run self-review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read CLAUDE.md, then execute pipeline/biweekly-review.md end to end.
            Commit the report and experiment log as instructed, and open the review
            issue with `gh` (GH_TOKEN is set).
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch"
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          GH_TOKEN: ${{ github.token }}

      - name: Push any uncommitted data changes
        # anthropics/claude-code-action rewrites the git remote to its own short-lived
        # token, then revokes it right after its step ends - before this step runs.
        # A plain `git push` here fails auth silently if it relies on that credential.
        # Push against an explicit, fresh URL using this job's own github.token instead.
        #
        # Same fetch+rebase+retry fix already proven live on daily-pipeline.yml - a bare
        # push here would lose this run's report the same way.
        run: |
          git config user.name "outreach-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add data/
          git diff --cached --quiet || git commit -m "biweekly review $(date -u +%F) (workflow sweep)"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching + rebasing onto latest ${{ github.ref_name }}..."
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              git rebase --abort
              echo "::error::Rebase conflict - this run's changes could NOT be pushed."
              exit 1
            fi
          done
          echo "::error::Still rejected after 5 fetch+rebase attempts - giving up."
          exit 1
